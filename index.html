  {t:'Last: surface with V. On the surface the diesels recharge your battery and air, and the deck gun (G) can fire. But you are loud and easy to see.', ok:()=>G.sub.depth<2},
];
function showTut(){ const st=TUT[G.tut]; $('tut').hidden=false; $('tutStep').textContent=`Training · step ${G.tut+1} of ${TUT.length}`; $('tutText').textContent=st.t; say('tut'+G.tut,st.t.split('. ')[0]+'.',0,false,true); }
function updTutorial(){
  const st=TUT[G.tut]; if(!st) return;
  if(st.ok()){ G.tut++; S.coin(); if(G.tut>=TUT.length) return finishTraining(); showTut(); }
  else if(st.fail && st.fail()){ G.tut=3; showTut(); $('tutText').textContent='Missed. Let the crew re-plot, put the crosshair on ◆ AIM and fire again.'; }
}
function finishTraining(){
  $('tut').hidden=true; G.state='debrief';
  showOverlay(`<h2>Training complete</h2><p>You can find, track, sink and hide. In real missions the escorts listen, ping and hunt you, so take short looks and slip away after you fire.</p>
    <div class="btnrow"><button class="go" data-go="newgame">Begin career</button><button class="go alt" data-go="title">Main menu</button></div>`);
}
$('tutSkip').addEventListener('click',()=>{ $('tut').hidden=true; G.tut=-1; G.state='title'; setupMission(1); titleScreen(); });
function titleScreen(){
  const sv=loadCareer();
  showOverlay(`
    <h1>Periscope Depth</h1><div class="eyebrow" style="margin-top:6px">Version ${VERSION.slice(1)}</div>
    <div class="sub">North Atlantic, 1942. You command an Allied submarine on a campaign against the German surface fleet. Hunt warships, raid harbours and rescue downed airmen without being found.</div>
    <div class="btnrow">
      ${sv?`<button class="go" data-go="cont">Continue · Mission ${sv.level}</button><button class="go alt" data-go="newgame">New career</button>`:`<button class="go" data-go="newgame">Begin career</button>`}
      <button class="go alt" data-go="training">Training</button>
      ${sv?`<button class="go alt" data-go="record:title">Service record</button>`:''}
    </div>
    <h3>How to attack</h3>
    <ul class="tips">
      <li>Marks around the periscope rim and orange lines on the plotting table point to ships you can <b>hear</b>. Turn toward them.</li>
      <li>Keep a ship in view. The crew plots a firing solution and shows <b>◆ AIM</b> ahead of it. Put the crosshair on ◆ AIM and fire.</li>
      <li>New to submarines? Start with <b>Training</b>: a five-minute guided attack.</li>
      <li>Between missions, spend command points on refits, earn medals and climb the ranks from Lieutenant to Commodore.</li>
    </ul>
    <h3>How to stay hidden</h3>${STEALTH}
    <h3>Sound</h3>${optsHtml()}
    <h3>Controls</h3>${CONTROLS}`);
}
const BRIEF = {
  convoy: b=>`Intelligence reports a German force bearing about <b class="num">${b}°</b>, roughly 3.5 km out, steaming across your position. Sink the targets before they pass.`,
  battleship: b=>`A German battleship is breaking out into the Atlantic, bearing about <b class="num">${b}°</b>. She takes five torpedo hits to sink, and her destroyer screen is the best in the fleet. She won't slow down for you.`,
  harbor: b=>`Enemy ships lie at anchor in a bay bearing about <b class="num">${b}°</b>, 3.5 km away. A minefield guards the approach. Your sonar marks mines on the plotting table within 450 m. The mines are moored shallow, so at 70 m you pass under most of them. Patrol boats circle the anchorage.`,
  duel: b=>`A U-boat is hunting in your patrol area, bearing about <b class="num">${b}°</b>. She is as quiet as you are: listen for her with the hydrophones (H). At night she surfaces to charge her batteries, which is your best chance to see her. If she hears you, she will fire torpedoes at you. Turn hard or dive below 30 m to dodge them.`,
  rescue: b=>`An RAF bomber crew is adrift in a life raft bearing about <b class="num">${b}°</b>, 2.5 km away (green mark on the rim and plot). German patrol boats are searching for them and closing in. Get within 60 m of the raft at periscope depth, slow to Stop or Slow, and hold for 10 seconds while the crew pulls them aboard. If the Germans reach the raft first, the airmen are captured.`,
};
const WX_TEXT = {
  clear:n=>n?'A dark, clear night. Their lookouts will not see your periscope beyond about 900 m, but you will struggle to see them past 3 km. Escorts fire star shells when hunting.':'Clear daylight. Lookouts can spot a raised periscope out to about 2 km. Keep your looks short.',
  fog:()=>'Thick fog. Lookouts will barely see you, but you will only see ships that are close. Listen for them.',
  rain:()=>'Steady rain. Visibility is poor both ways, and the hiss on the water masks your engines a little.',
  rough:()=>'Heavy seas. Waves will wash over the periscope, and the noise of the sea hides you. Firing solutions still work.',
};
function brief(){
  setupMission(G.level);
  G.state='brief';
  const M=G.mis, s=G.sub;
  const names = a => { if(!a.length) return 'none'; const m={}; a.forEach(t=>m[TYPES[t].name]=(m[TYPES[t].name]||0)+1); return Object.entries(m).map(([n,c])=>c>1?`${c} × ${n}`:n).join(', '); };
  const tgt = G.raft ? G.raft : G.land ? {x:G.land.px,y:G.land.py} : G.group;
  const b=pad3(brgTo(s.x,s.y,tgt.x,tgt.y)+rnd(-6,6));
  const typeName={convoy:'Convoy attack',battleship:'Capital ship',harbor:'Harbour raid',rescue:'Rescue',duel:'Submarine duel'}[M.type];
  showOverlay(`
    <div class="eyebrow">Mission ${G.level} · ${typeName} · ${G.night?'Night':'Day'} · ${G.wx.name}</div>
    <h2>${M.name}</h2>
    ${mapSvg()}
    <p>${BRIEF[M.type](b)}</p>
    ${M.neutrals?'<p><b>Neutral shipping in the area.</b> Identify every ship before you fire: the readout shows NEUTRAL COLOURS once the crew has had a good look. Sinking a neutral costs command points.</p>':''}
    ${!G.night&&!G.wx.fog&&G.level>1?'<p>Enemy aircraft patrol by day. Listen for the lookout.</p>':''}
    <div class="tally">
      ${M.type==='rescue'?'<span>Objective</span><span class="t">Rescue 4 airmen</span>':`<span>Targets</span><span class="t">${names(M.targets)}</span>`}
      <span>Escorts</span><span class="t">${names(M.escorts)}</span>
      <span>Torpedoes</span><span class="t">${G.tubes.filter(t=>t.ready).length} loaded + ${G.reserve} reserve</span>
      <span>Hull</span><span class="t">${Math.round(s.hull)}%</span>
      <span>Difficulty</span><span class="t">${D().name}</span>
    </div>
    <p>${WX_TEXT[M.wx](G.night)}</p>
    <div class="eyebrow">${rankOf(G.total)} · command points ${G.merit}</div>
    <button class="go" data-go="launch">Up periscope</button>`);
}
function upgradesHtml(){
  return `<h3>Refit · <span class="num">${G.merit}</span> command point${G.merit===1?'':'s'} to spend</h3>
    <div class="shop">${UPGRADES.map(u=>{ const lv=G.up[u.id], cost=UP_COST[lv];
      return `<div class="up"><div><b>${u.name}</b><span class="pips">${'■'.repeat(lv)}${'□'.repeat(3-lv)}</span><small>${u.desc}</small></div>
        <button class="buy" data-go="buy:${u.id}" ${lv>=3||G.merit<cost?'disabled':''}>${lv>=3?'Maxed':`Buy · ${cost} pt${cost>1?'s':''}`}</button></div>`; }).join('')}</div>`;
}
function debrief(){
  G.state='debrief';
  const st=G.stats, M=G.mis;
  let pts=Math.floor(st.tons/1000) + (st.rescued?8:0);
  const clean=!st.detected && !st.neutral;
  const ghost=clean && pts>0 ? Math.ceil(pts*.5) : 0;
  const ghostT=clean && st.tons>0 ? Math.round(st.tons*.5) : 0;
  const pen=8*st.neutral;
  const rankBefore=rankOf(G.total);
  G.total+=st.tons+ghostT; G.merit=Math.max(0,G.merit+pts+ghost-pen);
  const win=['done','rescued'].includes(G.endReason);
  if(clean && win) G.career.ghosts++;
  G.career.log.push({n:G.level,name:M.name,win,res:win?(st.tons?fmt(st.tons)+' t':'success'):G.endReason==='dry'?'no ammo':G.endReason==='captured'?'failed':'escaped'});
  const fresh=MEDALS.filter(m=>!G.career.medals.includes(m.id)&&m.test(st)); fresh.forEach(m=>G.career.medals.push(m.id));
  const rankAfter=rankOf(G.total);
  saveBest();
  const why = {dry:'Out of torpedoes. Returning to base to rearm.', escaped:'The enemy got away.', done:'All targets accounted for.',
    rescued:'The airmen are safe aboard. Their families will hear good news tonight.', captured:'The Germans reached the raft first. The airmen are prisoners.'}[G.endReason]||'';
  G.lastResult = `
    <h2>Mission ${G.level} · ${M.name}</h2>
    <p>${why}</p>
    <div class="tally">
      <span>Ships sunk</span><span class="t">${st.sunk.length?st.sunk.join(', '):'none'}</span>
      <span>Torpedoes fired / hits</span><span class="t">${st.fired} / ${st.hits}</span>
      <span>Tonnage</span><span class="t">${fmt(st.tons)} t</span>
      ${M.type==='rescue'?`<span>Airmen rescued</span><span class="t">${st.rescued?'4 of 4':'0'}</span>`:''}
      <span>Ghost bonus (never detected)</span><span class="t">${ghost||ghostT?'+50%':st.detected?'lost':'—'}</span>
      ${st.neutral?`<span>Neutral ships sunk</span><span class="t">${st.neutral} · −${pen} pts</span>`:''}
      <span>Command points earned</span><span class="t">+${Math.max(0,pts+ghost-pen)}</span>
      <span>Career tonnage</span><span class="t">${fmt(G.total)} t</span>
    </div>
    ${rankAfter!==rankBefore?`<div class="award">Promoted to <b>${rankAfter}</b>.</div>`:''}
    ${fresh.map(m=>`<div class="award">Awarded the <b>${m.name}</b>: ${m.desc}</div>`).join('')}
    <p>The tender patches the hull (+40%), recharges the battery and reloads every tube.</p>`;
  if(rankAfter!==rankBefore||fresh.length) S.coin();
  saveCareer();
  renderDebrief();
}
function renderDebrief(){ showOverlay(`${G.lastResult}${upgradesHtml()}<div class="btnrow"><button class="go" data-go="next">Next mission</button><button class="go alt" data-go="record:debrief">Service record</button></div>`); }
function gameOver(){
  G.state='over';
  G.total+=G.stats.tons; saveBest(); clearCareer();
  showOverlay(`
    <h2>Boat lost</h2>
    <p>The pressure hull gave way on mission ${G.level}, ${G.mis.name}. The sea takes her down.</p>
    <div class="tally">
      <span>Missions survived</span><span class="t">${G.level-1}</span>
      <span>Career tonnage</span><span class="t">${fmt(G.total)} t</span>
      <span>Best career</span><span class="t">${fmt(G.best)} t</span>
    </div>
    <p>Tip: when the escorts start pinging, lower the periscope, drop to Ahead Slow and dive. Move away from where you fired.</p>
    <button class="go" data-go="retry">New command</button>`);
}
function saveBest(){ if(G.total>G.best){ G.best=G.total; try{ localStorage.setItem('periscope-depth-best',String(G.best)); }catch(e){} } }
function pauseCard(){ showOverlay(`<h2>Paused</h2><div class="eyebrow">${rankOf(G.total)} · Mission ${G.level} · ${G.mis.name} · ${D().name} · ${VERSION}</div>
  ${G.mis.type!=='training'?'<div class="btnrow"><button class="go alt" data-go="record:pause">Service record</button></div>':''}<h3>Sound</h3>${optsHtml()}<h3>Controls</h3>${CONTROLS}<h3>Staying hidden</h3>${STEALTH}<button class="go" data-go="resume">Resume</button>`); }
function pause(){
  if(G.state!=='play') return;
  G.prevState=G.state; G.state='paused';
  if(VO.ok) speechSynthesis.cancel();
  pauseCard();
}

/* ================= input ================= */
const inp={scopeL:false,scopeR:false,port:false,stbd:false,fast:false};
const keyHold={ArrowLeft:'scopeL',ArrowRight:'scopeR',KeyA:'port',KeyD:'stbd'};
addEventListener('keydown',e=>{
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') inp.fast=true;
  if(keyHold[e.code]){ inp[keyHold[e.code]]=true; e.preventDefault(); return; }
  if(e.repeat) return;
  const playing=G.state==='play';
  switch(e.code){
    case 'Space': if(playing){ fire(); e.preventDefault(); } break;
    case 'KeyQ': toggleScope(); break;
    case 'KeyZ': toggleZoom(); break;
    case 'KeyW': case 'ArrowUp': setSpeed(1); e.preventDefault(); break;
    case 'KeyS': case 'ArrowDown': setSpeed(-1); e.preventDefault(); break;
    case 'KeyC': toggleDive(); break;
    case 'KeyV': toggleSurface(); break;
    case 'KeyX': toggleTorp(); break;
    case 'KeyG': fireGun(); break;
    case 'KeyH': toggleHydro(); break;
    case 'KeyT': toggleTime(); break;
    case 'KeyM': toggleMap(); break;
    case 'KeyP': case 'Escape': if(playing) pause(); else if(G.state==='paused') GO.resume(); break;
  }
});
addEventListener('keyup',e=>{
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') inp.fast=false;
  if(keyHold[e.code]) inp[keyHold[e.code]]=false;
});
addEventListener('blur',()=>{ for(const k in inp) inp[k]=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });

document.querySelectorAll('[data-hold]').forEach(b=>{
  const k=b.dataset.hold;
  const on=e=>{ e.preventDefault(); inp[k]=true; b.classList.add('held'); auInit(); try{b.setPointerCapture(e.pointerId);}catch(_){} };
  const off=()=>{ inp[k]=false; b.classList.remove('held'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
});
const ACTS={fire,gun:fireGun,ttype:toggleTorp,surface:toggleSurface,hydro:toggleHydro,scope:toggleScope,zoom:toggleZoom,slower:()=>setSpeed(-1),faster:()=>setSpeed(1),dive:toggleDive,time:toggleTime};
document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{ auInit(); ACTS[b.dataset.act](); b.blur(); }));
function toggleMap(){ G.mapBig=!G.mapBig; $('mapWrap').classList.toggle('big',G.mapBig); }
$('mapWrap').addEventListener('click',toggleMap);
$('bHelp').addEventListener('click',()=>{ if(G.state==='play') pause(); else if(G.state==='paused') GO.resume(); });
$('bSound').addEventListener('click',()=>{ AU.on=!AU.on; auInit(); if(AU.master) AU.master.gain.value=AU.on?.8:0; if(!AU.on&&VO.ok) speechSynthesis.cancel(); $('bSound').textContent=AU.on?'SND':'MUTE'; });
if(VO.ok && speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged',()=>{ VO.voice=null; pickVoice(); });

let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,type:e.pointerType}; try{cv.setPointerCapture(e.pointerId);}catch(_){} });
cv.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x; drag.x=e.clientX;
  const R=Math.min(W,H)*.47, dpp=G.fov/(2*R);
  G.scopeBrg=wrap360(G.scopeBrg + (drag.type==='mouse'?dx:-dx)*dpp);
});
const endDrag=()=>{ drag=null; };
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{ e.preventDefault(); const z=e.deltaY<0; if(z!==G.zoom) toggleZoom(); },{passive:false});

/* ================= main loop ================= */
G.last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-G.last)/1000); G.last=now;
  G.rt+=dt;
  G.fov = lerp(G.fov, G.zoom?9:36, Math.min(1,dt*10));
  if(G.state==='play'||G.state==='sinking'){
    const rate=(inp.fast?75:28)*(G.zoom?.3:1);
    if(inp.scopeL) G.scopeBrg=wrap360(G.scopeBrg-rate*dt);
    if(inp.scopeR) G.scopeBrg=wrap360(G.scopeBrg+rate*dt);
    let rem=dt*(G.state==='play'?G.ts:1);
    while(rem>0){ const h=Math.min(.05,rem); step(h); rem-=h; }
    updSighting(dt);
    if(G.sys.scope>=.5) G.zoom=false;
    if(G.mis.type==='training' && G.state==='play') updTutorial();
    if(G.state==='sinking'){ G.sub.scopeWant=false; G.sub.dTarget=200; G.shake=Math.max(G.shake,2); }
    drawCine(dt);
  } else if(G.state==='title'||G.state==='brief'){
    if(!G.group.fixed){ updGroup(G.group,dt); for(const e of G.ships){ const p=offsetPos(G.group,e.off[0],e.off[1]); e.x=p.x; e.y=p.y; e.h=G.group.h; e.v=G.group.cur; emitShip(e,dt); } }
    updFx(dt);
    if(G.state==='title'){ const tgt=brgTo(0,0,G.group.x,G.group.y); G.scopeBrg=wrap360(G.scopeBrg+clamp(wrap180(tgt-G.scopeBrg),-4*dt,4*dt)); }
  }
  G.shake*=Math.pow(.02,dt); G.hurt*=Math.pow(.1,dt);
  drawScope(); drawMap(); updCompass();
  hudT-=dt; if(hudT<=0){ hudT=.1; updHud(); }
  auUpdate();
  requestAnimationFrame(frame);
}

// boot: a quiet scene behind the title card
G.sub={x:0,y:0,h:0,spd:0,set:0,depth:SCOPE_DEPTH,dTarget:SCOPE_DEPTH,scopeWant:true,scope:1,upT:0,hull:100};
resupply(); setupMission(1); G.sub.set=0; G.sub.spd=0;
$('ver').textContent=VERSION;
resize(); titleScreen();
requestAnimationFrame(frame);
</script>
</body>
</html>
