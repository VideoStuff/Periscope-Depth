<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Periscope Depth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Layout: one-screen instrument. Header strip; a stage holding the periscope lens with four corner gauges
     (detection, torpedoes, boat, plot); a control rail of brass-edged buttons underneath. Single dark look by design. */
  :root{
    --hull:#090d0c; --steel:#121a18; --steel-2:#1b2523; --line:rgba(201,164,92,.24);
    --brass:#c9a45c; --paper:#e7dec8; --muted:#8e9a92;
    --safe:#7fb59a; --warn:#e3a63c; --danger:#e2553f;
    --display:'Saira Stencil One','Arial Narrow',Impact,sans-serif;
    --body:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
    --mono:'Share Tech Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--hull);color:var(--paper);font-family:var(--body);user-select:none;-webkit-user-select:none}
  #app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1320px;margin:0 auto;
    padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
  #brand{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--brass);line-height:1;white-space:nowrap}
  .ver{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);vertical-align:middle;border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:4px}
  #mission{font-size:15px;color:var(--muted);letter-spacing:.04em;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mission b{color:var(--paper);font-weight:600}
  #topbtns{display:flex;gap:6px}
  .ibtn{font-family:var(--mono);font-size:13px;color:var(--paper);background:var(--steel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;min-width:36px}
  .ibtn:hover{border-color:var(--brass)}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  #stage{position:relative;flex:1 1 auto;min-height:0;border-radius:14px;overflow:hidden;background:#020303;border:1px solid var(--line)}
  #scope{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:ew-resize}
  .panel{position:absolute;background:rgba(9,13,12,.8);border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    width:clamp(150px,21%,232px);font-size:14px;line-height:1.25;pointer-events:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:700}
  .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:4px;color:var(--muted)}
  .row b{font-family:var(--mono);font-weight:400;color:var(--paper);font-size:13px;text-align:right;white-space:nowrap}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  #pStealth{top:10px;left:10px}
  #pTorps{top:10px;right:10px}
  #pBoat{bottom:10px;left:10px}
  #meter{position:relative;height:14px;margin-top:6px;border-radius:3px;background:#1a2320;overflow:hidden;border:1px solid #ffffff14}
  #meterFill{position:absolute;inset:0 auto 0 0;width:0;background:var(--safe);transition:background-color .3s}
  #meter i{position:absolute;top:0;bottom:0;width:1px;background:#000a}
  #detState{font-family:var(--display);font-size:19px;margin-top:5px;letter-spacing:.04em;color:var(--safe)}
  #detState.warn{color:var(--warn)} #detState.danger{color:var(--danger);animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .ok{color:var(--safe)!important} .caution{color:var(--warn)!important} .bad{color:var(--danger)!important}
  #tubes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
  .tube{height:30px;border:1px solid #ffffff22;border-radius:5px;position:relative;overflow:hidden;background:#141c1a}
  .tube i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#d7b56b,#9c7c3c)}
  .tube span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:#0b0f0e;z-index:1}
  .tube.empty span{color:var(--muted)}
  #compassRow{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
  #compass{width:68px;height:68px;flex:none;display:block}
  .cdial{fill:#0c1513;stroke:rgba(201,164,92,.45);stroke-width:1.5}
  #cTicks line{stroke:var(--muted);stroke-width:1}
  #cTicks line.maj{stroke:var(--paper);stroke-width:1.6}
  .cdir{fill:var(--muted);font:600 10px var(--body);text-anchor:middle;dominant-baseline:central}
  .cdir.cn{fill:var(--brass)}
  .cscope{stroke:var(--paper);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
  .cboat{fill:var(--safe)} .ctower{fill:#0c1513}
  .hdgbox{min-width:0}
  .hlbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #hdgBig{font-size:26px;line-height:1.05;color:var(--paper)}
  #rudderTxt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  #hullbar{height:8px;border-radius:2px;background:#3a1712;margin-top:5px;overflow:hidden}
  #hullfill{height:100%;width:100%;background:var(--safe);transition:width .3s}
  #mapWrap{position:absolute;bottom:10px;right:10px;width:clamp(130px,22%,240px);aspect-ratio:1/1;max-width:100%;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#07100f;cursor:pointer}
  #mapWrap.big{width:min(62%,560px)}
  #map{width:100%;height:100%;display:block}
  #toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(46%,460px);z-index:3}
  .toast{font-family:var(--mono);font-size:13px;padding:6px 12px;border-radius:6px;background:rgba(9,13,12,.9);border:1px solid var(--line);color:var(--paper);text-align:center;animation:tin .25s ease-out}
  .toast.good{border-color:#c9a45c;color:#f1d79a} .toast.bad{border-color:var(--danger);color:#ffb4a6}
  .toast.crew{font-family:var(--body);font-size:16px;font-style:italic;border-color:#7fb59a66;color:#cfe6d8}
  @keyframes tin{from{opacity:0;transform:translateY(-6px)}}
  #cine{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(36%,440px);aspect-ratio:16/9;max-width:100%;
    border:1px solid var(--brass);border-radius:10px;overflow:hidden;z-index:4;background:#000;box-shadow:0 10px 40px #000c}
  #cine[hidden]{display:none}
  #cineCv{width:100%;height:100%;display:block}
  #cineCap{position:absolute;left:0;right:0;top:0;padding:6px 34px 10px 9px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:#f1d79a;background:linear-gradient(#000b,#0000)}
  #cineX{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#000a;color:var(--paper);cursor:pointer;font-size:13px;line-height:1}

  #controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:stretch}
  .grp{display:flex;gap:6px;align-items:stretch}
  .cb{font-family:var(--body);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--paper);background:var(--steel-2);
    border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:58px;touch-action:none}
  .cb kbd{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
  .cb:hover{border-color:var(--brass)} .cb:active,.cb.held{background:#2b3633;border-color:var(--brass)}
  .cb.fire{background:#5a1c14;border-color:#e2553f88;color:#ffe2d8;min-width:92px;font-family:var(--display);font-size:20px;letter-spacing:.08em}
  .cb.fire:active{background:#7a271b}
  .cb.on{border-color:var(--brass);color:#f1d79a}

  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,5,5,.72);z-index:5;padding:16px;overflow:auto}
  #overlay[hidden]{display:none}
  .card{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:660px;width:100%;max-height:100%;overflow:auto;box-shadow:0 30px 80px #000c}
  .card h1{font-family:var(--display);font-weight:400;color:var(--brass);font-size:clamp(30px,6vw,46px);margin:0;line-height:1;letter-spacing:.03em;text-wrap:balance}
  .card h2{font-family:var(--display);font-weight:400;color:var(--brass);font-size:26px;margin:0 0 4px;letter-spacing:.03em;text-wrap:balance}
  .card .sub{color:var(--muted);font-size:17px;margin:8px 0 14px}
  .card p{font-size:17px;line-height:1.4;margin:8px 0;max-width:62ch}
  .card h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin:16px 0 6px}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
  .cols div{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px solid #ffffff0d;padding:3px 0}
  .cols kbd{font-family:var(--mono);color:#f1d79a;font-size:13px}
  ul.tips{margin:4px 0;padding-left:18px;font-size:16px;line-height:1.4} ul.tips li{margin:3px 0}
  .tally{font-family:var(--mono);font-size:15px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:12px 0}
  .tally .t{color:#f1d79a;text-align:right}
  .go{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:#120d05;background:var(--brass);border:0;border-radius:10px;padding:12px 26px;margin-top:16px;cursor:pointer}
  .go:hover{background:#dcb96e}
  .go.alt{background:transparent;color:var(--paper);border:1px solid var(--line);font-size:18px}
  .btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .choice{display:grid;gap:8px;margin-top:10px}
  .choice button{text-align:left;background:var(--steel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--paper);cursor:pointer;font-family:var(--body);font-size:16px}
  .choice button:hover{border-color:var(--brass)}
  .choice b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--brass);display:block;letter-spacing:.04em}
  .shop{display:grid;gap:8px;margin-top:6px}
  .up{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 11px;border:1px solid #ffffff14;border-radius:9px;background:#0e1513}
  .up div{min-width:0} .up b{font-size:17px} .up small{display:block;color:var(--muted);font-size:14px;line-height:1.3}
  .pips{font-family:var(--mono);color:var(--brass);letter-spacing:.15em;font-size:13px;margin-left:6px}
  .buy{flex:none;font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--brass);background:transparent;color:#f1d79a;cursor:pointer;white-space:nowrap}
  .buy:disabled{opacity:.35;cursor:default;border-color:var(--line)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt-btn{font-family:var(--mono);font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--steel-2);color:var(--paper);cursor:pointer}
  .opt-btn.on{border-color:var(--brass);color:#f1d79a}

  [hidden]{display:none!important}
  .cb.dim{opacity:.45}
  #tut{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(46%,500px);max-width:100%;background:rgba(9,13,12,.94);
    border:1px solid var(--brass);border-radius:10px;padding:10px 13px;z-index:4;font-size:16px;line-height:1.35;box-shadow:0 10px 30px #000b}
  #tutStep{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--brass);text-transform:uppercase;margin-bottom:3px}
  #tutSkip{margin-top:7px;font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 9px;cursor:pointer}
  .cmap{width:100%;height:auto;max-height:26vh;display:block;border-radius:8px;border:1px solid var(--line);margin:10px 0 4px}
  .cmap text{font-family:var(--mono);font-size:7px;fill:rgba(231,222,200,.42);letter-spacing:.12em}
  .cmap .pulse{animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{from{r:3;opacity:1}to{r:13;opacity:0}}
  .medals{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .medal{display:flex;gap:9px;align-items:center;opacity:.35;padding:7px 9px;border:1px solid #ffffff12;border-radius:8px}
  .medal.got{opacity:1;border-color:var(--line);background:#0e1513}
  .medal b{font-size:15px} .medal small{display:block;color:var(--muted);font-size:13px;line-height:1.25}
  .rib{width:13px;height:24px;flex:none;border-radius:2px;background:linear-gradient(90deg,#8a2222 0 33%,#e7dec8 33% 66%,#1f3a7a 66%)}
  .medal.got .rib{box-shadow:0 0 0 1px var(--brass)}
  .award{border:1px solid var(--brass);border-radius:9px;padding:9px 12px;margin:10px 0;background:#1a1810;color:#f1d79a;font-size:16px}
  .log{font-family:var(--mono);font-size:13px;display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px}
  .log .w{color:var(--safe)} .log .l{color:var(--danger)}
  @media (max-width:760px){
    #brand{font-size:18px} #mission{font-size:13px}
    .panel{width:clamp(132px,41%,190px);font-size:12px;padding:7px 9px}
    .row b{font-size:12px} #detState{font-size:15px} .opt{display:none}
    #mapWrap{width:clamp(110px,34%,170px)} #mapWrap.big{width:min(92%,420px)}
    #compass{width:38px;height:38px} #hdgBig{font-size:16px} #compassRow{gap:6px;margin:3px 0 0}
    #pBoat{width:clamp(120px,36%,160px);padding:6px 8px}
    #pBoat .lbl,#pBoat .hlbl{display:none}
    #pBoat .row{margin-top:2px} #rudderTxt{font-size:10px} #hullbar{height:5px;margin-top:3px}
    #pBoat .row.hullrow{display:none}
    .cb{min-width:48px;padding:7px 8px;font-size:13px} .cb kbd{display:none} .cb.fire{min-width:76px;font-size:17px}
    #toasts{width:80%;top:auto;bottom:40%}
    #cine{width:84%;bottom:auto;top:8px}
    #tut{width:94%;bottom:auto;top:8px;font-size:14px}
    .medals{grid-template-columns:1fr}
    .cols{grid-template-columns:1fr}
    .card{padding:18px 16px}
  }
  @media (hover:none){.cb kbd{display:none}}
  @media (prefers-reduced-motion:reduce){#detState.danger{animation:none} .toast{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand">Periscope Depth <span id="ver" class="ver"></span></div>
    <div id="mission">North Atlantic · 1942</div>
    <div id="topbtns">
      <button class="ibtn" id="bSound" title="Sound on/off">SND</button>
      <button class="ibtn" id="bHelp" title="Pause, settings and controls">II</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="scope" aria-label="Periscope view"></canvas>

    <section class="panel" id="pStealth" aria-live="polite">
      <div class="lbl">Detection</div>
      <div id="meter"><div id="meterFill"></div><i style="left:30%"></i><i style="left:65%"></i><i style="left:95%"></i></div>
      <div id="detState">UNDETECTED</div>
      <div class="row">Noise <b id="noiseTxt">Silent</b></div>
      <div class="row">Periscope <b id="expTxt">Down</b></div>
      <div class="row opt">Enemy sonar <b id="pingTxt">Quiet</b></div>
    </section>

    <section class="panel" id="pTorps">
      <div class="lbl">Torpedo Room</div>
      <div id="tubes"></div>
      <div class="row">Reserve <b id="reserveTxt" class="num">10</b></div>
      <div class="row">Type <b id="ttypeTxt">Steam</b></div>
      <div class="row opt">Deck gun <b id="gunTxt" class="num">40 shells</b></div>
      <div class="row opt">Firing solution <b id="solTxt">No target</b></div>
    </section>

    <section class="panel" id="pBoat">
      <div class="lbl">Control Room</div>
      <div class="row">Depth <b id="depthTxt" class="num">14 m</b></div>
      <div class="row">Speed <b id="speedTxt">Ahead Slow</b></div>
      <div class="row">Batt · Air <b id="battTxt" class="num">100 · 100</b></div>
      <div id="compassRow">
        <svg id="compass" viewBox="-50 -50 100 100" aria-hidden="true">
          <circle r="47" class="cdial"></circle>
          <g id="cTicks"></g>
          <text y="-35" class="cdir cn">N</text><text x="36" class="cdir">E</text><text y="36" class="cdir">S</text><text x="-36" class="cdir">W</text>
          <line id="cScope" x1="0" y1="0" x2="0" y2="-46" class="cscope"></line>
          <g id="cBoat"><path d="M0,-27 L6,-12 L6,18 L0,24 L-6,18 L-6,-12 Z" class="cboat"></path><rect x="-2" y="-6" width="4" height="9" class="ctower"></rect></g>
        </svg>
        <div class="hdgbox">
          <div class="hlbl">Heading</div>
          <div id="hdgBig" class="num">000°</div>
          <div id="rudderTxt">Steady</div>
        </div>
      </div>
      <div class="row hullrow">Hull <b id="hullTxt" class="num">100%</b></div>
      <div id="hullbar"><div id="hullfill"></div></div>
      <div class="row" id="sysRow" hidden>Damage <b id="sysTxt" class="bad"></b></div>
    </section>

    <div id="mapWrap" title="Plotting table (tap or M to enlarge)"><canvas id="map" aria-label="Plotting table"></canvas></div>
    <div id="cine" hidden><canvas id="cineCv" aria-label="Close-up of a sinking ship"></canvas><div id="cineCap"></div><button id="cineX" aria-label="Close the close-up">✕</button></div>
    <div id="tut" hidden><div id="tutStep"></div><div id="tutText"></div><button id="tutSkip">Skip training</button></div>
    <div id="toasts"></div>
    <div id="overlay"></div>
  </main>

  <nav id="controls" aria-label="Boat controls">
    <div class="grp">
      <button class="cb" data-hold="scopeL">&#9664; Scope<kbd>&larr;</kbd></button>
      <button class="cb" data-hold="scopeR">Scope &#9654;<kbd>&rarr;</kbd></button>
      <button class="cb" data-act="zoom" id="bZoom">Zoom<kbd>Z</kbd></button>
      <button class="cb" data-act="scope" id="bScope">Lower<kbd>Q</kbd></button>
      <button class="cb" data-act="hydro" id="bHydro">Listen<kbd>H</kbd></button>
    </div>
    <div class="grp">
      <button class="cb fire" data-act="fire" id="bFire">FIRE<kbd>SPACE</kbd></button>
      <button class="cb" data-act="ttype" id="bTtype">Steam<kbd>X</kbd></button>
      <button class="cb dim" data-act="gun" id="bGun">Gun<kbd>G</kbd></button>
    </div>
    <div class="grp">
      <button class="cb" data-hold="port">Port<kbd>A</kbd></button>
      <button class="cb" data-hold="stbd">Stbd<kbd>D</kbd></button>
      <button class="cb" data-act="slower">Slower<kbd>S</kbd></button>
      <button class="cb" data-act="faster">Faster<kbd>W</kbd></button>
      <button class="cb" data-act="dive" id="bDive">Dive<kbd>C</kbd></button>
      <button class="cb" data-act="surface" id="bSurf">Surface<kbd>V</kbd></button>
      <button class="cb" data-act="time" id="bTime">Time 1&times;<kbd>T</kbd></button>
    </div>
  </nav>
</div>

<script>
'use strict';
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const D2R = Math.PI/180, TAU = Math.PI*2;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rnd = (a,b) => a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const wrap360 = a => ((a%360)+360)%360;
const wrap180 = a => ((a%360)+540)%360-180;
const dist = (ax,ay,bx,by) => Math.hypot(bx-ax,by-ay);
const brgTo = (ax,ay,bx,by) => wrap360(Math.atan2(bx-ax,by-ay)/D2R);
const fmt = n => Math.round(n).toLocaleString('en-US');
const pad3 = n => String(Math.round(wrap360(n))%360).padStart(3,'0');

function missionSpec(n){
  if (n<=CAMPAIGN.length) return CAMPAIGN[n-1];
  const k=n-CAMPAIGN.length, type=pick(['convoy','convoy','battleship','harbor','rescue','duel']);
  const ne=Math.min(6,3+Math.floor(k/2)), nt=Math.min(4,2+Math.floor(k/3));
  const escorts=[]; for(let i=0;i<ne;i++) escorts.push(['destroyer','destroyer','tboat','destroyer','patrol','tboat'][i]);
  let targets=[]; if(type==='battleship') targets=['battleship'];
  else if(type==='duel'){ targets=['uboat']; escorts.length=Math.min(1,Math.floor(k/3)); escorts.fill('patrol'); }
  else if(type!=='rescue') for(let i=0;i<nt;i++) targets.push(pick(['lcruiser','hcruiser','tanker','hcruiser']));
  const name=pick(['Grey','Iron','Cold','Silent','Long','Black','Wolf'])+' '+pick(['Watch','Tide','Hunt','Patrol','Water','Passage']);
  return {type, name, night:type==='duel'?true:Math.random()<.45, wx:pick(['clear','clear','fog','rain','rough']), targets, escorts, spd:8, neutrals:type==='convoy'&&Math.random()<.5?1:0};
}

  const h=g.h*D2R, s=Math.sin(h), c=Math.cos(h);
  return {x:g.x + f*s + r*c, y:g.y + f*c - r*s};
}

const AU = {ctx:null, on:true};
function auInit(){

  try { AU.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }

  const dly=a.createDelay(1); dly.delayTime.value=.11;
  const fbLp=a.createBiquadFilter(); fbLp.type='lowpass'; fbLp.frequency.value=240;
  const fb=a.createGain(); fb.gain.value=.4; const wet=a.createGain(); wet.gain.value=.55;
  AU.uw.connect(AU.master); AU.uw.connect(dly); dly.connect(fbLp); fbLp.connect(fb); fb.connect(dly); fbLp.connect(wet); wet.connect(AU.master);
  // sea hiss (louder in rain / heavy seas)
  const n=a.createBufferSource(); n.buffer=b; n.loop=true;
  const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
  AU.sea=a.createGain(); AU.sea.gain.value=.045; n.connect(lp).connect(AU.sea).connect(AU.master); n.start();
  // own motors
  const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=44;
  const lp2=a.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=140;
  AU.eng=a.createGain(); AU.eng.gain.value=0; o.connect(lp2).connect(AU.eng).connect(AU.master); o.start(); AU.engO=o;
  // enemy screws: chug-chug through the hull

  const lp3=a.createBiquadFilter(); lp3.type='lowpass'; lp3.frequency.value=240;
  const am=a.createGain(); am.gain.value=.5;
  const lfo=a.createOscillator(); lfo.frequency.value=4; const lg=a.createGain(); lg.gain.value=.5; lfo.connect(lg).connect(am.gain); lfo.start();
  AU.screw=a.createGain(); AU.screw.gain.value=0; so.connect(lp3).connect(am).connect(AU.screw).connect(AU.master); so.start(); AU.lfo=lfo;
  // music bus and a tension heartbeat
  const mlp=a.createBiquadFilter(); mlp.type='lowpass'; mlp.frequency.value=900;
  AU.mus=a.createGain(); AU.mus.gain.value=G.opt.music?1:0; mlp.connect(AU.mus).connect(AU.master); AU.musIn=mlp;
  const ho=a.createOscillator(); ho.type='sine'; ho.frequency.value=52;
  const hAm=a.createGain(); hAm.gain.value=0; const hl=a.createOscillator(); hl.type='square'; hl.frequency.value=1.15;
  const hlg=a.createGain(); hlg.gain.value=.5; hl.connect(hlg).connect(hAm.gain); hl.start();
  const hlp=a.createBiquadFilter(); hlp.type='lowpass'; hlp.frequency.value=90;
  AU.tens=a.createGain(); AU.tens.gain.value=0; ho.connect(hAm).connect(hlp).connect(AU.tens).connect(AU.master); ho.start();
  // aircraft engines (heard only with a head above water)
  const po=a.createOscillator(); po.type='sawtooth'; po.frequency.value=92;
  const plp=a.createBiquadFilter(); plp.type='lowpass'; plp.frequency.value=600;
  AU.plane=a.createGain(); AU.plane.gain.value=0; po.connect(plp).connect(AU.plane).connect(AU.master); po.start(); AU.planeO=po;

function tone(type,freq,t0,dur,vol,endFreq,out){
  const a=AU.ctx; if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(out||AU.master); o.start(t0); o.stop(t0+dur+.05);
}
function noise(t0,dur,vol,ftype,f0,f1,out){
  const a=AU.ctx; if(!a) return;
  const s=a.createBufferSource(); s.buffer=AU.noise; const f=a.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(f0,t0);
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g).connect(out||AU.master); s.start(t0, Math.random()); s.stop(t0+dur+.05);
}

    const o=a.createOscillator(), g=a.createGain(); o.type='sawtooth';

  dc(v,close){ if(!AU.ctx) return; const t=AU.ctx.currentTime, uw=AU.uw, cut=lerp(140,420,close);

// slow, dark generative score: minor-key pads that drift every ten seconds
const MUS = {next:0, i:0};
const CHORDS = [[73.4,87.3,110],[58.3,73.4,87.3],[65.4,82.4,98],[55,65.4,82.4],[73.4,87.3,110],[61.7,77.8,92.5]];
function musicTick(){
  if(!AU.ctx) return; const a=AU.ctx;
  AU.mus.gain.value = G.opt.music ? 1 : 0;
  if(a.currentTime<MUS.next) return;
  const t=a.currentTime+.05, ch=CHORDS[MUS.i++%CHORDS.length], dur=10;
  ch.forEach((f,j)=>{ for(const det of [-4,4]){
    const o=a.createOscillator(), g=a.createGain(); o.type=j===2?'sine':'triangle'; o.frequency.value=f*(j===2?2:1); o.detune.value=det;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(j===2?.012:.02,t+3.5); g.gain.linearRampToValueAtTime(.0001,t+dur+2.5);
    o.connect(g).connect(AU.musIn); o.start(t); o.stop(t+dur+2.7); } });
  MUS.next=t+dur-.3;
}
function auUpdate(){
  if(!AU.ctx) return;
  const s=G.sub, play=G.state==='play';
  const surf=s.depth<2;
  AU.eng.gain.value = play ? (surf ? .07 : .05*Math.pow(s.spd/MAXSPD,1.5)) : 0;
  AU.engO.frequency.value = surf ? 30+s.spd*3 : 38+s.spd*4;
  let pg=0; if(play && scopeExposed()) for(const p of G.planes){ pg=Math.max(pg,clamp(1-dist(s.x,s.y,p.x,p.y)/6000,0,1)); }
  AU.plane.gain.value=.06*pg*pg; AU.planeO.frequency.value=86+pg*12;
  AU.sea.gain.value = .045*(G.wx.rain?2:1)*(G.wx.swell>2?1.6:1);
  let best=0, bv=0;
  if(play) for(const e of G.ships){ if(e.sunk||e.sinking||e.escaped) continue; const d=dist(s.x,s.y,e.x,e.y);
    const v=clamp(1-d/(e.role==='escort'?2200:1600),0,1)*(e.v/10+.3); if(v>best){best=v;bv=e.v;} }
  if(G.hydro && play){ const h=hydroAt(G.scopeBrg); AU.screw.gain.value=.3*clamp(h.i,0,1); AU.lfo.frequency.value=2+(h.e&&h.e.v?h.e.v*.35:6); }
  else { AU.screw.gain.value = .14*best; AU.lfo.frequency.value = 2+bv*.35; }
  AU.tens.gain.value = (play&&G.opt.music) ? .22*clamp((G.maxAlert-25)/70,0,1) : 0;
  musicTick();
}

const VO = {last:{}, ok:typeof speechSynthesis!=='undefined', voice:null};
function pickVoice(){
  if(!VO.ok) return null; if(VO.voice) return VO.voice;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return null;
  VO.voice = vs.find(v=>/en-GB/i.test(v.lang)&&/male|daniel|george|arthur/i.test(v.name)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  return VO.voice;
}
function say(key, text, gap=8, urgent=false, quiet=false){
  if(G.state!=='play' && G.state!=='sinking') return;
  if(VO.last[key]!==undefined && G.rt-VO.last[key]<gap) return;
  VO.last[key]=G.rt;
  if(!quiet) toast('“'+text+'”','crew');
  if(!G.opt.voice||!VO.ok||!AU.on) return;
  try{
    const u=new SpeechSynthesisUtterance(text); u.rate=1.08; u.pitch=.7; u.volume=.9;
    const v=pickVoice(); if(v) u.voice=v;
    if(urgent) speechSynthesis.cancel();
    if(speechSynthesis.speaking && !urgent && speechSynthesis.pending) return;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= game actions ================= */
function noiseLevel(){
  const s=G.sub; if(s.depth<2) return .75;   // diesels running on the surface
  let n=Math.pow(s.spd/MAXSPD,2.2)*(1-.18*G.up.motors)*(1+.6*G.sys.motors);
  if(s.depth>40) n*=.55;
  return n;
}
function scopeExposed(){ return G.sub.scope>.6 && G.sub.depth<MAX_SCOPE_DEPTH; }
const surfaced = () => G.sub.depth<2;
function flareLight(x,y){
  let L=0; for(const f of G.flares){ const d=dist(x,y,f.x,f.y); L=Math.max(L, clamp(1-d/1600,0,1)*clamp(1-f.life/f.max,0,1)*clamp(f.z/80,0,1)); } return L;
}

function fire(){
  if(G.state!=='play') return;
  const s=G.sub;
  if(s.depth>MAX_FIRE_DEPTH){ toast('Too deep to fire — come up to periscope depth (C)','bad'); return; }
  if(G.fireCd>0) return;
  const tube=G.tubes.find(t=>t.ready);
  if(!tube){ toast(G.reserve>0?'All tubes reloading…':'No torpedoes left','bad'); return; }
  tube.ready=false; tube.t=0; tube.loading=G.reserve>0; if(tube.loading) G.reserve--;
  G.fireCd=.8; G.stats.fired++;
  const h=G.scopeBrg;
  const tk=TORPS[G.ttype];
  G.torps.push({x:s.x+Math.sin(h*D2R)*8, y:s.y+Math.cos(h*D2R)*8, h, run:0, ox:s.x, oy:s.y, trail:[], alive:true, lastT:0, v:tk.v, range:tk.range, type:G.ttype});
  S.launch();
  for(const e of G.ships){ if(e.sunk||e.sinking||e.escaped) continue;
    const d=dist(s.x,s.y,e.x,e.y); if(d<2600){ e.alert=Math.min(100,e.alert+20*(1-d/2600)*D().det); setLK(e,s.x,s.y,320); } }
  const n=G.tubes.indexOf(tube)+1;

}

function setLK(e,x,y,err){
  const ex=x+gauss()*err, ey=y+gauss()*err;

/* ================= simulation ================= */
function step(dt){
  G.t+=dt;
  updSub(dt);
  if(!G.group.fixed) updGroup(G.group,dt);
  updPack();
  for(const e of G.ships) updShip(e,dt);
  updTorps(dt);
  updShells(dt);
  updCharges(dt);
  updFlares(dt);
  updPlanes(dt);
  updMission(dt);
  updFx(dt);
  checkEnd(dt);
}
function updSub(dt){
  const s=G.sub;
  const sub=s.depth>2;
  const cap=Math.min(G.sys.motors>=.5?1:G.sys.motors>.15?2:3, sub&&s.batt<=0?0:3);
  s.spd += clamp(SPEEDS[Math.min(s.set,cap)]-s.spd, -.45*dt, .35*dt);
  // battery and air: drained underwater, recharged by the diesels on the surface
  if(G.mis.type!=='training'){
    const ez=G.diff==='easy'?.7:1;
    if(sub){ s.batt=Math.max(0,s.batt-(.012+.5*Math.pow(s.spd/MAXSPD,2))*(1-.15*G.up.battery)*ez*dt); s.air=Math.max(0,s.air-.09*ez*dt); }
    else { s.batt=Math.min(100,s.batt+.9*dt); s.air=Math.min(100,s.air+6*dt); }
    if(sub && s.batt<20) say('batt20','Battery down to twenty percent, Captain.',120);
    if(sub && s.batt<=0) say('batt0',"Battery's flat! We can't move submerged. We must surface!",45,true);
    if(sub && s.air<25) say('air25',"The air's getting foul, sir. We need to surface soon.",120);
    if(s.air<=0){ s.hull=Math.max(0,s.hull-.35*dt); say('air0','Men are passing out! We have to surface!',30,true); }
  }
  // damage control: one party fixes the worst problem first
  const fixK=['flood','motors','scope'].find(q=>G.sys[q]>0);
  if(fixK){ G.sys[fixK]=Math.max(0,G.sys[fixK]-dt/(fixK==='flood'?30:50));
    if(G.sys[fixK]===0) say('fix'+fixK,{flood:'Flooding is under control.',motors:'Motors repaired. Full power available.',scope:'Periscope optics replaced, Captain.'}[fixK],5); }
  if(G.sys.flood>0) s.hull=Math.max(0,s.hull-G.sys.flood*.25*dt);
  if(s.hull<=0 && G.state==='play'){ G.state='sinking'; setTimeout(gameOver,2600); }
  if(s.dTarget<2) s.scopeWant=true;
  G.gunCd-=dt;
  const turn = (inp.port?-1:0)+(inp.stbd?1:0);
  const dh = turn*(.6+3.6*Math.min(1,s.spd/3))*dt;
  s.h = wrap360(s.h + dh);
  G.scopeBrg = wrap360(G.scopeBrg + dh); // the periscope is mounted on the boat, so it swings with her
  s.x += Math.sin(s.h*D2R)*s.spd*dt; s.y += Math.cos(s.h*D2R)*s.spd*dt;
  if(G.land){ const L=G.land, over=(s.x-L.px)*L.nx+(s.y-L.py)*L.ny+250; // keep off the shoals

}
function updMission(dt){
  const r=G.raft; if(!r||r.done||r.lost) return;
  const s=G.sub, d=dist(s.x,s.y,r.x,r.y);
  if(d<60 && s.depth<=MAX_SCOPE_DEPTH && s.spd<3.3){
    if(r.prog===0) say('raft','Raft alongside! Get those men aboard, quickly!',30);
    r.prog=Math.min(1,r.prog+dt/10);
    if(r.prog>=1){ r.done=true; G.stats.rescued=true; S.coin(); say('raft2','We have them aboard! All four of them!',0,true); toast('Airmen rescued! Slip away when you can.','good'); }
  } else if(d<60 && r.prog<1 && G.rt%4<dt*1.2) toast('Hold at periscope depth and slow to Stop or Slow to pick them up');
  for(const e of G.ships){ if(e.sunk||e.sinking) continue;
    if(dist(e.x,e.y,r.x,r.y)<90){ r.cap+=dt; if(r.cap>12){ r.lost=true; G.stats.captured=true; toast('The Germans picked up the airmen. Mission failed.','bad'); say('raft3',"They've got them. Damn.",0); } } }
}
function damage(n,msg){
  n*=D().dmg*(1-.12*G.up.hull);
  const s=G.sub; s.hull=Math.max(0,s.hull-n); G.hurt=1; G.shake=Math.max(G.shake,6);
  if(n>=7 && s.hull>0 && Math.random()<Math.min(.75,n/35)) breakSystem();
  if(msg) toast(`${msg}  −${Math.round(n)}%`,'bad');
  if(s.hull<30 && s.hull>0) say('flood','We are taking on water! Hull is failing!',30,true);
  if(s.hull<=0 && G.state==='play'){ G.state='sinking'; setTimeout(gameOver,2600); }
}
function breakSystem(){
  const k=pick(['scope','motors','flood','flood']);
  G.sys[k]=Math.min(1,G.sys[k]+rnd(.45,.85));
  say('sys'+k,{scope:'The periscope is damaged! Optics cracked!',motors:'Motors damaged! We can only make slow speed!',flood:'Flooding aft! Damage control party, move!'}[k],8,true);
}
function updTorps(dt){
  for(const t of G.torps){
    if(t.alive){
      const step=t.v*dt;
      t.x+=Math.sin(t.h*D2R)*step; t.y+=Math.cos(t.h*D2R)*step; t.run+=step;
      if(t.run-t.lastT>7){ t.lastT=t.run; t.trail.push({x:t.x,y:t.y,t:G.t,j:rnd(-.6,.6),s:rnd(.8,1.25)}); }
      if(t.run>t.range){ t.alive=false; if(!t.enemy) toast('Torpedo ran out of fuel — missed'); continue; }
      if(t.enemy){ const s=G.sub, d=dist(t.x,t.y,s.x,s.y);
        if(d<14 && s.depth<30){ t.alive=false; S.thit(1,1); explosion(t.x,t.y,{T:{L:60,B:6,fb:2}}); damage(55,"TORPEDO HIT! We've been torpedoed!"); }
        else if(d<2500 && !t.warned && Math.abs(wrap180(brgTo(t.x,t.y,s.x,s.y)-t.h))<20){ t.warned=true; say('etorp2','Torpedo closing! Hard over! Go deep!',6,true); }
        continue; }
      for(const e of G.ships){
        if(e.sunk||e.sinking||e.escaped) continue;
        const rx=t.x-e.x, ry=t.y-e.y, fx=Math.sin(e.h*D2R), fy=Math.cos(e.h*D2R);
        const al=rx*fx+ry*fy, ac=rx*fy-ry*fx;
        const d=Math.hypot(rx,ry);
        const tk=TORPS[t.type||'steam'];
        if(!e.spotted.has(t) && e.role!=='neutral' && !(e.T.sub&&e.dep>1) && d<(G.night?420:850)*G.wx.enemy*tk.spot){
          e.spotted.add(t);
          if(Math.random()<(G.night?.25:.5)*Math.sqrt(tk.spot)){
            e.alert=Math.min(100,e.alert+30); setLK(e,t.ox,t.oy,420);
            if(!e.anchored){ const a=t.h, b=wrap360(t.h+180); e.evadeH = Math.abs(wrap180(a-e.h))<Math.abs(wrap180(b-e.h))?a:b; e.evadeT=10; }
            if(e.role==='target') alarmGroup(t.ox,t.oy);
            if(isVisible(e)) toast(`${e.T.name} spotted the torpedo wake — evading!`);
          }
        }
        if(Math.abs(al)<e.T.L/2 && Math.abs(ac)<e.T.B/2+1.5){
          t.alive=false;
          if(t.run<ARM_DIST){ S.clang(); toast('Hit, but the warhead had not armed yet (too close)','bad'); }
          else if(Math.random()<.08){ S.clang(); say('dud','Dud! It hit and did not go off!',5); e.alert=Math.min(100,e.alert+40); setLK(e,t.ox,t.oy,300); }
          else hitShip(e,t);
          break;
        }
      }
    }
  }
  G.torps = G.torps.filter(t=>t.alive || (t.trail.length && G.t-t.trail[t.trail.length-1].t<24));
  for(const t of G.torps) while(t.trail.length && G.t-t.trail[0].t>24) t.trail.shift();
}
function hitShip(e,t){
  G.stats.hits++; e.hp--;
  const s=G.sub, d=dist(s.x,s.y,e.x,e.y);
  S.thit(clamp(900/(d+300),.15,1), clamp(1-d/4000,0,1));
  if(d<6000) G.shake=Math.max(G.shake,clamp(3000/(d+200),0,3));
  explosion(t.x,t.y,e);
  for(const o of G.ships){ if(o.sunk||o.escaped||o.sinking) continue;
    if(dist(o.x,o.y,t.x,t.y)<5200){ o.alert=Math.max(o.alert,80); setLK(o,t.ox,t.oy,340); } }
  alarmGroup(t.ox,t.oy);
  G.ts=1;
  if(e.role==='neutral') neutralHit(e);
  if(e.hp<=0) sinkShip(e,'torp');
  else {
    toast(`HIT! ${e.T.name} damaged — ${e.hp} more hit${e.hp>1?'s':''} to sink`,'good');
    say('hit','Hit! Torpedo hit!',0,true);
    e.burnT=1;
  }
}

function neutralHit(e){ if(e.nWarned) return; e.nWarned=true; toast('That ship is flying neutral colours!','bad'); }
function sinkShip(e,how){
  e.sinking=.001;
  if(e.role==='neutral'){ G.stats.neutral++; toast(`You sank a neutral merchant ship. The Admiralty will not be pleased.`,'bad'); say('neutral','God help us. She was neutral, sir.',0,true); }
  else {
    G.stats.tons+=e.T.tons; G.stats.sunk.push(e.T.name);
    if(how==='gun') G.stats.gunKills++; if(e.T.key==='uboat') G.stats.uboat++; if(e.T.key==='battleship') G.stats.battleship++;
    toast(`SUNK: ${e.T.name} · ${fmt(e.T.tons)} t`,'good');
    say('sunk',pick(["She's going down!","She's breaking up! Good shooting!","Got her! She's sinking!"]),0,true);
  }
  if(G.lock===e) G.lock=null;
  if(e.T.tons>=2000) startCine(e);
}
/* ---- particles ---- kinds: water (white, falls), mist (white haze), fire, flash, smoke (dark), fsmoke (funnel) */
function P(o){ G.fx.push(Object.assign({vx:0,vy:0,vz:0,r:2,gr:0,life:0,max:2,a:1,v:Math.random()*3|0,g:false},o)); }
function column(x,y,size,ship){
  // a tall plume of white water that rises, hangs and collapses into mist
  const n=Math.round(26*size+8), H=ship?1.25:1;
  for(let i=0;i<n;i++){ const k=Math.random();
    P({k:'water',x:x+gauss()*1.1*size,y:y+gauss()*1.1*size,z:0,vx:gauss()*.6*size,vy:gauss()*.6*size,vz:(18+k*34)*Math.sqrt(size)*H,r:(1+k*1.6)*size,gr:1.1*size,max:rnd(2.6,3.8)*Math.sqrt(size),a:.62,g:true}); }
  for(let i=0;i<Math.round(8*size)+3;i++){ const a=rnd(0,TAU), sp=rnd(3,7)*size;
    P({k:'mist',x,y,z:rnd(1,3),vx:Math.sin(a)*sp,vy:Math.cos(a)*sp,vz:rnd(.3,1),r:3*size,gr:2.6*size,max:rnd(3.5,5),a:.22}); }
}
function splashSmall(x,y){ for(let i=0;i<6;i++) P({k:'water',x:x+gauss(),y:y+gauss(),vz:rnd(4,8),r:rnd(.6,1.2),gr:.8,max:rnd(1,1.6),a:.5,g:true}); }
function explosion(x,y,e){
  column(x,y,clamp(e.T.L/120,.9,1.8),true);
  P({k:'flash',x,y,z:6,r:e.T.B*1.2,gr:30,max:.28,a:1});
  for(let i=0;i<12;i++) P({k:'fire',x:x+gauss()*4,y:y+gauss()*4,z:rnd(2,e.T.fb+6),vx:gauss()*3,vy:gauss()*3,vz:rnd(6,18),r:rnd(4,8),gr:7,max:rnd(.6,1.2),a:.95});
  for(let i=0;i<10;i++) P({k:'smoke',x:x+gauss()*5,y:y+gauss()*5,z:rnd(4,14),vx:G.wind.x*.5,vy:G.wind.y*.5,vz:rnd(4,9),r:rnd(5,9),gr:5,max:rnd(8,12),a:.8});
}
function burnFx(e){
  const off=rnd(-.35,.35)*e.T.L, x=e.x+Math.sin(e.h*D2R)*off, y=e.y+Math.cos(e.h*D2R)*off;
  const top = Math.max(1.5, e.T.fb*(1-e.sinking*1.2)+2);
  P({k:'smoke',x,y,z:top,vx:G.wind.x*.8,vy:G.wind.y*.8,vz:rnd(5,9),r:rnd(4,8),gr:rnd(4,7),max:rnd(9,14),a:.75});
  if(Math.random()<.7) P({k:'fire',x,y,z:top,vz:rnd(2,6),r:rnd(2.5,5),gr:2,max:rnd(.4,.9),a:.9});
}
function updFx(dt){
  for(const p of G.fx){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.r+=p.gr*dt;
    if(p.g){ p.vz-=9.8*dt; p.vx*=.99; p.vy*=.99; if(p.z<0){ p.z=0; p.vz=0; p.life=Math.max(p.life,p.max*.8); } }
    else if(p.k==='smoke'||p.k==='fsmoke'){ p.vz*=Math.pow(.92,dt); p.vx=lerp(p.vx,G.wind.x,dt*.2); p.vy=lerp(p.vy,G.wind.y,dt*.2); }
    else if(p.k==='mist'){ p.vx*=Math.pow(.6,dt); p.vy*=Math.pow(.6,dt); } }
  G.fx=G.fx.filter(p=>p.life<p.max);
  if(G.fx.length>1300){ let over=G.fx.length-1300; G.fx=G.fx.filter(p=>!(over>0 && p.k==='fsmoke' && over--)); }
  // smouldering damaged ships keep burning
  for(const e of G.ships){ if(e.burnT && !e.sinking && !e.sunk && Math.random()<dt*4) burnFx(e); }
}
function checkEnd(dt){
  if(G.state!=='play') return;
  const M=G.mis;
  if(M.type==='training') return;
  const torpsLeft = G.tubes.some(t=>t.ready||t.loading) || G.torps.some(t=>t.alive);
  if(G.endT<0){
    if(M.type==='rescue'){
      if(G.raft.done){ G.endT=G.t+6; G.endReason='rescued'; }
      else if(G.raft.lost){ G.endT=G.t+5; G.endReason='captured'; }
      return;
    }
    const live=G.ships.filter(e=>e.role==='target' && !e.sinking && !e.sunk && !e.escaped);
    if(!live.length){ G.endT=G.t+(G.cine?12:6); G.endReason = G.stats.escaped&&!G.stats.sunk.length?'escaped':'done'; }
    else if(!torpsLeft){ G.endT=G.t+4; G.endReason='dry'; toast('Out of torpedoes — breaking off the attack'); }
  } else if(G.t>=G.endT) debrief();
}
function visRange(){ return (G.night?3300:7500)*G.wx.vis; }
function isVisible(e){
  if(!scopeExposed()) return false;
  const s=G.sub, d=dist(s.x,s.y,e.x,e.y);
  const lit=G.night?flareLight(e.x,e.y):0;
  if(d>visRange()*(1+lit*1.2)*(e.T.neutral&&G.night?1.8:1)) return false;
  if(e.T.sub && e.dep>1 && d>(G.night?600:1500)) return false;   // only a periscope feather shows
  return Math.abs(wrap180(brgTo(s.x,s.y,e.x,e.y)-G.scopeBrg))<G.fov/2+1;
}
function updSighting(dt){
  let best=null, bd=1e9;
  const s=G.sub;
  for(const e of G.ships){
    if(e.sunk||e.escaped) continue;
    if(isVisible(e)){
      e.seenT=G.t; e.seenX=e.x; e.seenY=e.y; e.seenH=e.h;
      const rel=Math.abs(wrap180(brgTo(s.x,s.y,e.x,e.y)-G.scopeBrg));
      const d=dist(s.x,s.y,e.x,e.y);
      const score = rel - Math.atan(e.T.L*.5/d)/D2R;
      if(!e.sinking && score < G.fov*.12 && score<bd){ bd=score; best=e; }
    }
    if(e.sol>0 && G.t-e.obsT>25) e.sol=Math.max(0,e.sol-dt/30);
  }
  G.lock=best;
  if(best){ const was=best.sol; best.sol=Math.min(1,best.sol+dt/((G.zoom?2.2:3.4)/D().solve)); best.obsT=G.t;
    if(best.sol>=.35 && !best.idd){ best.idd=true; if(best.T.neutral) say('idn','Neutral colours on that one, Captain. Hold your fire.',20); }
    if(was<1&&best.sol>=1) say('sol',`Solution ready on the ${best.idd?best.T.name.toLowerCase():'target'}.`,6); }
}
function solution(e){
  const s=G.sub, px=e.x-s.x, py=e.y-s.y, vx=Math.sin(e.h*D2R)*e.v, vy=Math.cos(e.h*D2R)*e.v;
  const tv=TORPS[G.ttype].v, a=vx*vx+vy*vy-tv*tv, b=2*(px*vx+py*vy), c=px*px+py*py;
  const disc=b*b-4*a*c; if(disc<0) return null;
  const t1=(-b-Math.sqrt(disc))/(2*a), t2=(-b+Math.sqrt(disc))/(2*a);
  const t=Math.max(t1,t2); if(t<=0) return null;
  const ax=px+vx*t, ay=py+vy*t;
  return {brg:brgTo(0,0,ax,ay), range:Math.hypot(ax,ay), t};
}

const PAL = {
  day:{skyT:[92,116,132], skyH:[188,198,198], seaH:[66,86,92], seaN:[16,30,34], wave:[225,235,235], ship:[[78,85,92],[104,112,118],[44,49,54]], land:[52,62,56], ret:'rgba(8,12,10,.85)', retT:'rgba(8,12,10,.9)'},
  night:{skyT:[3,6,12], skyH:[24,34,48], seaH:[16,24,32], seaN:[3,6,9], wave:[130,150,170], ship:[[10,13,19],[13,16,23],[7,9,13]], land:[8,11,14], ret:'rgba(235,170,90,.7)', retT:'rgba(240,185,110,.9)'},
};
const rgb = (a,al=1) => `rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mix = (a,b,t) => [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const mul = (a,k) => [a[0]*k,a[1]*k,a[2]*k];
function makePal(){
  const b=G.night?PAL.night:PAL.day, wx=G.wx, p=JSON.parse(JSON.stringify(b));
  const fogC=G.night?[30,36,42]:[156,164,164], rainC=G.night?[14,18,24]:[110,118,122];
  if(wx.fog>=1){ p.skyT=mix(p.skyT,fogC,.85); p.skyH=mix(p.skyH,fogC,.9); p.seaH=mix(p.seaH,fogC,.6); }
  else if(wx.rain){ p.skyT=mix(p.skyT,rainC,.75); p.skyH=mix(p.skyH,rainC,.55); p.seaH=mix(p.seaH,rainC,.3); p.seaN=mul(p.seaN,.85); }
  else if(wx.swell>2){ p.skyT=mix(p.skyT,rainC,.4); p.skyH=mix(p.skyH,rainC,.25); }
  p.fogC=fogC; return p;
}
G.pal=makePal();

/* ---- camera + projection: the periscope and the close-up both render through drawWorld ---- */
function proj(env,x,y,z){
  const cam=env.cam, d=Math.max(1,dist(cam.x,cam.y,x,y));
  const rel=wrap180(brgTo(cam.x,cam.y,x,y)-cam.brg);
  if(Math.abs(rel)>cam.fov*.75) return null;
  const sc=env.f/d;
  return {x:env.CX+Math.tan(rel*D2R)*env.f, y:env.hy+(env.eye-z)*sc, sc, d, rel};
}

function drawScope(){
  const c=ctx; c.setTransform(DPR,0,0,DPR,0,0);
  const R=Math.min(W,H)*.47, CX=W/2, CY=H/2;
  const fov=G.fov, f=R/Math.tan(fov/2*D2R);
  const s=G.sub, t=G.rt, wx=G.wx;
  let sx=0, sy=0; if(G.shake>.05){ sx=rnd(-1,1)*G.shake; sy=rnd(-1,1)*G.shake; }
  c.fillStyle='#030504'; c.fillRect(0,0,W,H);
  const hg=c.createRadialGradient(CX,CY,R,CX,CY,Math.max(W,H)*.75);
  hg.addColorStop(0,'#0d1311'); hg.addColorStop(1,'#020303'); c.fillStyle=hg; c.fillRect(0,0,W,H);

  const swell=(.35*Math.sin(t*.8)+.22*Math.sin(t*1.9+1)+.12*Math.sin(t*2.7))*wx.swell;
  const eye = s.scope*4.2 - .9 + (s.scope>.2?swell:0) - Math.max(0,s.depth-SCOPE_DEPTH)*.6 + Math.max(0,SCOPE_DEPTH-s.depth)*.2;
  const roll=(Math.sin(t*.5)*.9+Math.sin(t*1.3)*.3)*D2R*Math.sqrt(wx.swell);
  const hy=CY+Math.sin(t*.63)*.18*D2R*f*wx.swell;
  const env={R,CX,CY,f,hy,eye,t,main:true,cam:{x:s.x,y:s.y,brg:G.scopeBrg,fov}};

  c.save(); c.translate(sx,sy);
  c.beginPath(); c.arc(CX,CY,R,0,TAU); c.clip();
  c.save(); c.translate(CX,CY); c.rotate(roll); c.translate(-CX,-CY);
  if(G.hydro) drawHydro(c,R,CX,CY);
  else if(eye>.12) drawWorld(c,env);
  else drawUnder(c,env);
  c.restore();
  if(eye<.5 && eye>-1.2 && s.scope>.3) G.wet=1;
  if(wx.rain && eye>.12 && !G.hydro){ G.wet=Math.max(G.wet,.45); drawRain(c,R,CX,CY,t); }
  if(G.wet>.02) drawWet(c,R,CX,CY);
  c.fillStyle=G.night?'rgba(10,30,20,.10)':'rgba(40,60,35,.10)'; c.fillRect(CX-R,CY-R,2*R,2*R);
  const vg=c.createRadialGradient(CX,CY,R*.62,CX,CY,R); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.78)');
  c.fillStyle=vg; c.fillRect(CX-R,CY-R,2*R,2*R);
  if(G.sys.scope>.05 && !G.hydro) drawCracks(c,R,CX,CY,G.sys.scope);
  if(eye>.12 && !G.hydro) drawReticle(c,env);
  drawSoundRim(c,R,CX,CY);
  c.restore();
  c.save(); c.translate(sx,sy);
  c.lineWidth=Math.max(6,R*.035); c.strokeStyle='#1d2422'; c.beginPath(); c.arc(CX,CY,R+c.lineWidth/2,0,TAU); c.stroke();
  c.lineWidth=1.5; c.strokeStyle='rgba(201,164,92,.45)'; c.beginPath(); c.arc(CX,CY,R+1,0,TAU); c.stroke();
  c.restore();
  if(G.hurt>.01){ const hg2=c.createRadialGradient(CX,CY,R*.5,CX,CY,Math.max(W,H)*.7); hg2.addColorStop(0,'rgba(226,85,63,0)'); hg2.addColorStop(1,`rgba(226,85,63,${.45*G.hurt})`); c.fillStyle=hg2; c.fillRect(0,0,W,H); }
}

function drawWorld(c,env){
  const {R,CX,CY,f,hy,eye,t,cam}=env, pal=G.pal, wx=G.wx;
  const L=CX-R*1.3, Rt=CX+R*1.3, T=CY-R*1.3, B=CY+R*1.3;
  const brg=cam.brg, fv=cam.fov*.75;
  const bx = b => { const r=wrap180(b-brg); return Math.abs(r)>fv ? null : CX+Math.tan(r*D2R)*f; };
  const light = G.night ? flareLight(cam.x,cam.y) : 0;
  // sky
  const skyTop=hy-Math.tan(28*D2R)*f;
  const sg=c.createLinearGradient(0,skyTop,0,hy);
  sg.addColorStop(0,rgb(pal.skyT)); sg.addColorStop(1,rgb(pal.skyH));
  c.fillStyle=sg; c.fillRect(L,T,Rt-L,hy-T+1);
  if(G.night && !wx.fog && !wx.rain){
    for(const st of G.stars){ const x=bx(st.b); if(x===null) continue; const y=hy-Math.tan(st.e*D2R)*f;
      c.fillStyle=`rgba(220,228,255,${(.25+.55*st.m*(0.7+0.3*Math.sin(t*2+st.b)))*(1-light)})`; c.fillRect(x,y,1.2,1.2); }
    const mx=bx(G.sunBrg); if(mx!==null){ const my=hy-Math.tan(24*D2R)*f, mr=Math.tan(.6*D2R)*f*1.4;
      const mg=c.createRadialGradient(mx,my,0,mx,my,mr*6); mg.addColorStop(0,'rgba(200,210,230,.35)'); mg.addColorStop(1,'rgba(200,210,230,0)');
      c.fillStyle=mg; c.fillRect(mx-mr*6,my-mr*6,mr*12,mr*12); c.fillStyle='#d9dde6'; c.beginPath(); c.arc(mx,my,mr,0,TAU); c.fill(); }
  } else if(!G.night && !wx.fog){
    const sx=bx(G.sunBrg); if(sx!==null){ const sy=hy-Math.tan(17*D2R)*f, sr=Math.tan(.5*D2R)*f*1.6, k=wx.rain?.35:1;
      const g=c.createRadialGradient(sx,sy,0,sx,sy,sr*9); g.addColorStop(0,`rgba(255,248,225,${.75*k})`); g.addColorStop(.2,`rgba(255,245,220,${.25*k})`); g.addColorStop(1,'rgba(255,245,220,0)');
      c.fillStyle=g; c.fillRect(sx-sr*9,sy-sr*9,sr*18,sr*18); }
  }
  if(!wx.fog) for(const cl of G.clouds){
    const r=wrap180(cl.b-brg); if(Math.abs(r)>fv+cl.w) continue;
    const x=CX+Math.tan(r*D2R)*f, y=hy-Math.tan(cl.e*D2R)*f, w=Math.tan(cl.w*D2R/2)*f, h=Math.tan(cl.h*D2R/2)*f;
    c.fillStyle = G.night?`rgba(40,50,66,${cl.a*.5})`:wx.rain?`rgba(90,98,104,${cl.a*.6})`:`rgba(225,228,226,${cl.a*.45})`;
    for(let i=-2;i<=2;i++){ c.beginPath(); c.ellipse(x+i*w*.35, y+Math.abs(i)*h*.15, w*.42, h*(1-Math.abs(i)*.18), 0, 0, TAU); c.fill(); }
  }
  // star shells hanging in the sky
  for(const fl of G.flares){ const pr=proj(env,fl.x,fl.y,fl.z); if(!pr) continue; const k=clamp(1-fl.life/fl.max,0,1);
    const r=Math.max(18,60*pr.sc)*(.7+.3*Math.sin(t*23+fl.x)); c.globalCompositeOperation='lighter'; c.globalAlpha=.9*k;
    c.drawImage(SPR.fire,pr.x-r,pr.y-r,r*2,r*2); c.globalAlpha=.6*k; c.drawImage(SPR.puff,pr.x-r*.25,pr.y-r*.25,r*.5,r*.5);
    c.globalAlpha=1; c.globalCompositeOperation='source-over'; }
  if(light>0){ c.fillStyle=`rgba(190,180,150,${.32*light})`; c.fillRect(L,T,Rt-L,hy-T+1); }
  // land (harbour missions)
  if(G.land) drawLand(c,env);
  // sea
  const seaG=c.createLinearGradient(0,hy,0,B);
  seaG.addColorStop(0,rgb(pal.seaH)); seaG.addColorStop(Math.min(1,.04*f/R+.08),rgb(mix(pal.seaH,pal.seaN,.5))); seaG.addColorStop(1,rgb(pal.seaN));
  c.fillStyle=seaG; c.fillRect(L,hy,Rt-L,B-hy);
  if(light>0){ c.fillStyle=`rgba(170,165,140,${.18*light})`; c.fillRect(L,hy,Rt-L,B-hy); }
  if(!wx.fog){ c.fillStyle=G.night?'rgba(120,140,160,.18)':'rgba(240,245,240,.35)'; c.fillRect(L,hy-.5,Rt-L,1.2); }
  // sun / moon glitter
  const gx=(wx.fog||wx.rain)?null:bx(G.sunBrg);
  if(gx!==null){
    const gw=Math.tan(3*D2R)*f;
    for(let i=0;i<60;i++){
      const k=(i*97.13+Math.floor(t*6)*13.7)%1, k2=(i*51.7+Math.floor(t*6)*7.3)%1;
      const yy=hy+Math.pow(k,1.8)*(B-hy), xx=gx+(k2-.5)*gw*(1+(yy-hy)/R*1.5);
      c.fillStyle=G.night?`rgba(210,220,240,${.35*(1-k)})`:`rgba(255,250,230,${.55*(1-k)})`;
      c.fillRect(xx,yy,2+3*k,1);
    }
  }
  // waves
  const lam=wx.swell>2?18:13, dMax=Math.min(900, 1.3*lam*f/(TAU*5)), amp0=.42*Math.sqrt(wx.swell);
  c.lineWidth=1;
  for(let i=0;i<26;i++){
    const d=5*Math.pow(1.24,i); if(d>dMax) break;
    const y0=hy+eye*f/d; if(y0>CY+R*1.2+30) continue; if(y0-hy<1.4) break;
    const amp=amp0*f/d, k=TAU*d/lam;
    c.strokeStyle=rgb(pal.wave,(.07+.16*Math.min(1,(y0-hy)/40))*(1-wx.fog*.5));
    c.beginPath();
    for(let x=CX-R; x<=CX+R; x+=5){
      const a=(brg*D2R+Math.atan((x-CX)/f));
      const y=y0-amp*(Math.sin(a*k+t*1.35+i*2.1)+.45*Math.sin(a*k*1.7-t*.9+i));
      x===CX-R?c.moveTo(x,y):c.lineTo(x,y);
    }
    c.stroke();
    if(wx.swell>2 && i%3===0){ // whitecaps
      c.globalAlpha=.35*Math.min(1,(y0-hy)/30)*(.6+.4*Math.sin(t*.9+i));
      for(let j=0;j<5;j++){ const xx=CX-R+((j*0.618+i*.37+Math.sin(t*.3+j)*.03)%1)*2*R, ww=Math.max(3,2.4*f/d), hh=Math.max(1,ww*eye/d*1.6);
        c.drawImage(SPR.puff,xx-ww/2,y0-amp*.8-hh/2,ww,hh); }
      c.globalAlpha=1;
    }
  }
  // objects, far to near
  const list=[];
  const maxD=G.night?3800:10500;
  for(const e of G.ships){ if(e.sunk||e.escaped) continue; const d=dist(cam.x,cam.y,e.x,e.y); if(d>maxD) continue;
    if(e.trail.length) list.push({d:d+e.T.L*.4,fn:()=>drawShipWake(c,env,e)});
    list.push({d,fn:()=>drawShip(c,env,e,d)}); }
  for(const p of G.fx){ const pr=proj(env,p.x,p.y,p.z); if(pr && pr.d>6) list.push({d:pr.d-1,fn:()=>drawFx(c,pr,p)}); }
  for(const tp of G.torps) list.push({d:1e5,fn:()=>drawWake(c,env,tp)});
  for(const pl of G.planes){ const pr=proj(env,pl.x,pl.y,pl.z); if(pr) list.push({d:pr.d,fn:()=>drawPlane(c,env,pl,pr)}); }
  if(G.raft && !G.raft.done && !G.raft.lost){ const pr=proj(env,G.raft.x,G.raft.y,0); if(pr) list.push({d:pr.d,fn:()=>drawRaft(c,env,pr)}); }
  list.sort((a,b)=>b.d-a.d);
  for(const o of list) o.fn();
  // fog and rain haze over the horizon
  if(wx.fog>0){
    const fh=Math.tan((wx.fog>=1?9:4)*D2R)*f;
    const fg=c.createLinearGradient(0,hy-fh,0,hy+fh*1.4);
    const fc=pal.fogC, a=wx.fog>=1?.85:.45;
    fg.addColorStop(0,rgb(fc,0)); fg.addColorStop(.45,rgb(fc,a)); fg.addColorStop(.6,rgb(fc,a*.9)); fg.addColorStop(1,rgb(fc,0));
    c.fillStyle=fg; c.fillRect(L,hy-fh,Rt-L,fh*2.4);
  }
  // near swell crest (washes over the lens when the eye is low)
  if(env.main && eye<2.2+wx.swell*.3){
    const dN=3.2;
    c.fillStyle=G.night?'rgba(6,12,16,.96)':rgb(mix(pal.seaN,pal.seaH,.35),.96);
    c.beginPath(); c.moveTo(L,B);
    for(let x=L;x<=Rt;x+=8){ const a=brg*D2R+Math.atan((x-CX)/f);
      const wh=(.55*Math.sin(a*9+t*1.1)+.35*Math.sin(a*17-t*1.7)+.4*Math.sin(t*.8))*Math.sqrt(wx.swell);
      c.lineTo(x, hy+(eye-wh)*f/dN); }
    c.lineTo(Rt,B); c.closePath(); c.fill();
  }
}

function drawLand(c,env){
  const {CX,f,hy,eye,R,cam}=env, L=G.land, pal=G.pal;
  const pts=[]; let run=[];
  const flush=()=>{ if(run.length>1) pts.push(run); run=[]; };
  for(let x=CX-R*1.3;x<=CX+R*1.3;x+=6){
    const a=cam.brg*D2R+Math.atan((x-CX)/f), ux=Math.sin(a), uy=Math.cos(a), den=ux*L.nx+uy*L.ny;
    if(den<.03){ flush(); continue; }
    const dl=((L.px-cam.x)*L.nx+(L.py-cam.y)*L.ny)/den;
    if(dl<=0||dl>16000){ flush(); continue; }
    const tx=cam.x+ux*dl, ty=cam.y+uy*dl, along=tx*L.ny-ty*L.nx;
    const hgt=55+30*Math.sin(along/900+L.seed)+18*Math.sin(along/260+L.seed*2)+8*Math.sin(along/90);
    run.push([x, hy+(eye-hgt)*f/dl, hy+eye*f/dl, dl]);
  }
  flush();
  for(const r of pts){
    const dAvg=r[Math.floor(r.length/2)][3], haze=clamp(dAvg/(G.night?5000:14000)/G.wx.vis,0,.9);
    c.fillStyle=rgb(mix(pal.land,pal.skyH,haze));
    c.beginPath(); c.moveTo(r[0][0],r[0][2]); for(const p of r) c.lineTo(p[0],p[1]); for(let i=r.length-1;i>=0;i--) c.lineTo(r[i][0],r[i][2]); c.closePath(); c.fill();
  }
}

function drawShip(c,env,e,d){
  const {f,CX,hy,eye,cam}=env, pal=G.pal, T=e.T;
  const rel=wrap180(brgTo(cam.x,cam.y,e.x,e.y)-cam.brg);
  if(Math.abs(rel)>80) return;
  const sc=f/d, sx=CX+Math.tan(rel*D2R)*f;
  if(Math.abs(sx-CX)-T.L*.6*sc>env.R*1.3) return;
  const b=brgTo(cam.x,cam.y,e.x,e.y)*D2R;
  const hs=Math.sin(e.h*D2R), hc=Math.cos(e.h*D2R);
  const k=hs*Math.cos(b)-hc*Math.sin(b);
  let Lk=T.L*k; if(Math.abs(Lk)<T.B) Lk=T.B*(k<0?-1:1);
  const bob=Math.sin(G.rt*.9+e.ph)*.35*G.wx.swell;
  let drop=e.sinking>0?Math.pow(e.sinking,1.5)*(T.Hmax*.75+6):0;
  if(T.sub) drop+=Math.min(e.dep,3)*1.3;
  const tilt=(e.sinking>0?e.tilt*Math.min(1,e.sinking*1.4)*.22*Math.sign(Lk):0) + Math.sin(G.rt*.7+e.ph)*.006*G.wx.swell;
  const wl=hy+eye*sc;
  const X=x=>sx+x*Lk*sc, Y=y=>wl-(y+bob-drop)*sc;
  if(T.sub && e.dep>1 && !e.sinking){   // submerged U-boat: only a periscope and its feather of spray
    if(d<1800){ const a=clamp(1-d/1800,0,1)*(G.night?.5:.9);
      c.strokeStyle=rgb(pal.ship[2],a); c.lineWidth=Math.max(1,.3*sc); c.beginPath(); c.moveTo(sx,wl); c.lineTo(sx,wl-3*sc); c.stroke();
      if(e.v>.8){ const fw=Math.max(3,(2+e.v)*sc), fh=Math.max(1.5,.8*sc); c.globalAlpha=a*.7; c.drawImage(SPR.puff,sx-fw/2,wl-fh*.6,fw,fh); c.globalAlpha=1; } }
    return; }
  // lighting: which side faces us, and is the sun on it?
  const tcx=cam.x-e.x, tcy=cam.y-e.y, rx=hc, ry=-hs, side=Math.sign(tcx*rx+tcy*ry)||1;
  const lit=Math.max(0,(side*rx)*Math.sin(G.sunBrg*D2R)+(side*ry)*Math.cos(G.sunBrg*D2R));
  const flare=G.night?flareLight(e.x,e.y):0;
  const bright=G.night?1+flare*2.2:(G.wx.fog||G.wx.rain?.9:.8+.42*lit);
  const hazeD=(G.night?3800:11000)*G.wx.vis;
  const haze=clamp(d/hazeD,0,.95)*(G.night?.75:1);
  const col=i=>mix(mul(pal.ship[i],bright),G.wx.fog?pal.fogC:pal.skyH,haze);
  const cols=[0,1,2].map(i=>rgb(col(i)));
  const big=Math.abs(Lk*sc);
  c.save();
  c.beginPath(); c.rect(sx-big-60, wl-(T.Hmax+20)*sc-80, big*2+120, (T.Hmax+20)*sc+80+1.2); c.clip();
  if(tilt){ c.translate(sx,wl); c.rotate(tilt); c.translate(-sx,-wl); }
  const path=pts=>{ c.beginPath(); pts.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1]))); c.closePath(); };
  for(const sh of T.prof){
    if(sh.t==='p'){
      path(sh.pts);
      if(sh.hull){
        const g=c.createLinearGradient(0,Y(T.fb+1),0,Y(-.5));
        const h0=col(0); g.addColorStop(0,rgb(mul(h0,1.12))); g.addColorStop(.55,rgb(h0)); g.addColorStop(1,rgb(mul(h0,.62)));
        c.fillStyle=g; c.fill();
        if(big>40 && !G.night){ // boot-topping, deck edge, portholes
          c.save(); c.clip();
          c.fillStyle=rgb(mul(h0,.45)); c.fillRect(Math.min(X(-.5),X(.5)),Y(.9),big,Y(-1)-Y(.9));
          c.fillStyle=rgb(mul(h0,1.25)); c.fillRect(Math.min(X(-.5),X(.5)),Y(T.fb+.1),big,Math.max(.6,.35*sc));
          if(big>230 && T.L>=85){ c.fillStyle=rgb(mul(h0,.5)); const st=7/T.L, ph=Math.max(.8,.45*sc);
            for(let x=-.42;x<.4;x+=st){ if(x>-.05&&x<.08) continue; c.fillRect(X(x)-ph/2,Y(T.fb*.55)-ph/2,ph,ph); } }
          c.restore();
        }
      } else { c.fillStyle=cols[sh.s]; c.fill(); }
    }
    else if(sh.t==='r'){ c.fillStyle=cols[sh.s]; c.fillRect(X(sh.x0),Y(sh.y1),X(sh.x1)-X(sh.x0),Y(sh.y0)-Y(sh.y1));
      if(big>160 && sh.s===1 && !G.night){ c.fillStyle=rgb(mul(col(1),.6)); c.fillRect(X(sh.x0),Y(sh.y1),X(sh.x1)-X(sh.x0),Math.max(.6,.4*sc)); } }
    else if(sh.t==='m'){ c.strokeStyle=cols[sh.s]; c.lineWidth=Math.max(.8,sh.w*sc); c.beginPath(); c.moveTo(X(sh.x),Y(sh.y0)); c.lineTo(X(sh.x),Y(sh.y1)); c.stroke(); }
    else if(sh.t==='b'){ c.strokeStyle=cols[sh.s]; c.lineWidth=Math.max(.7,sh.th*sc); c.beginPath(); c.moveTo(X(sh.x),Y(sh.y)); c.lineTo(X(sh.x+sh.len),Y(sh.y)); c.stroke(); }
  }
  // neutral ships paint their national colours on the hull, and run lit at night
  if(T.neutral && big>14){
    const fl=G.night?1.1:bright, hz=haze*.8;
    for(const f0 of [-.22,.18]){ const x0=X(f0-.06), x1=X(f0+.06), y0=Y(T.fb-.6), y1=Y(1.2), fh=y1-y0;
      c.fillStyle=rgb(mix(mul([30,80,150],fl),pal.skyH,hz)); c.fillRect(x0,y0,x1-x0,fh);
      c.fillStyle=rgb(mix(mul([235,195,45],fl),pal.skyH,hz)); c.fillRect(X(f0-.02),y0,X(f0)-X(f0-.02),fh); c.fillRect(x0,y0+fh*.4,x1-x0,fh*.2); }
    if(G.night){ c.fillStyle='rgba(255,220,140,.95)';
      for(const lx of [-.4,-.3,-.05,.05,.12,.3,.45]){ c.beginPath(); c.arc(X(lx),Y(T.fb+1.5),Math.max(.9,.35*sc),0,TAU); c.fill(); } }
  }
  // radio aerials strung between the masts
  if(big>150 && T.masts.length>1){ c.strokeStyle=rgb(col(2),.6); c.lineWidth=Math.max(.5,.12*sc);
    const m=T.masts; c.beginPath(); c.moveTo(X(m[0][0]),Y(m[0][1])); c.lineTo(X(m[1][0]),Y(m[1][1])); c.moveTo(X(m[0][0]),Y(m[0][1])); c.lineTo(X(.5),Y(T.fb+2)); c.stroke(); }
  // bow wave and stern wash
  if(e.v>1.5 && !e.sinking){
    const fa=clamp(e.v/12,0,1)*(1-haze)*(G.night?.4+flare*.4:.85);
    const bw=Math.max(3,T.B*(1.1+e.v*.08)*sc), bh=Math.max(1.5,(1+e.v*.18)*sc);
    c.globalAlpha=fa; c.drawImage(SPR.puff,X(.49)-bw/2,wl-bh*.75,bw,bh*1.2);
    c.globalAlpha=fa*.8; c.drawImage(SPR.puff,X(-.5)-bw*.7,wl-bh*.5,bw*1.4,bh*.9);
    c.globalAlpha=fa*.35; c.drawImage(SPR.puff,Math.min(X(-.5),X(.5)),wl-bh*.35,big,bh*.6);
    c.globalAlpha=1;
  }
  c.restore();
}
function drawShipWake(c,env,e){
  const a0=(G.night?.16:.3)*(1-G.wx.fog*.5);
  for(const q of e.trail){
    const pr=proj(env,q.x,q.y,0); if(!pr||pr.d<15) continue;
    const age=G.t-q.t, w=(q.w+age*.55)*pr.sc*2, h=Math.max(.8,w*env.eye/pr.d*1.4);
    c.globalAlpha=a0*Math.pow(1-age/45,1.6); c.drawImage(SPR.puff,pr.x-w/2+q.j*pr.sc,pr.y-h/2,w,h);
  }
  c.globalAlpha=1;
}
function drawFx(c,pr,p){
  const k=p.life/p.max, r=Math.max(.8,p.r*pr.sc);
  let a;
  if(p.k==='water') a=p.a*Math.pow(1-k,1.3);
  else if(p.k==='mist') a=p.a*Math.sin(Math.PI*k);
  else if(p.k==='fire'||p.k==='flash') a=p.a*(1-k);
  else a=p.a*Math.min(1,k*5)*(1-k);
  if(G.wx.fog) a*=clamp(1-pr.d/(5000*G.wx.vis),0,1);
  if(a<=.004) return;
  if(p.k==='fire'||p.k==='flash'){ c.globalCompositeOperation='lighter'; c.globalAlpha=a; c.drawImage(SPR.fire,pr.x-r,pr.y-r,r*2,r*2); c.globalCompositeOperation='source-over'; }
  else if(p.k==='smoke'||p.k==='fsmoke'){
    c.globalAlpha=a*(G.night?.55:1)*(p.k==='fsmoke'?.8:1); c.drawImage(SPR.smoke[p.v],pr.x-r,pr.y-r,r*2,r*2);
  } else { c.globalAlpha=a*(G.night?.45:1); c.drawImage(SPR.puff,pr.x-r,pr.y-r,r*2,r*2); }
  c.globalAlpha=1;
}
function drawWake(c,env,tp){
  // bubbles surface a moment after the torpedo passes: a thin, broadening, fading line of foam
  const a0=(G.night?.22:.55)*(1-G.wx.fog*.6)*(G.wx.swell>2?.6:1)*TORPS[tp.type||'steam'].wake;
  const tr=tp.trail;
  for(let i=0;i<tr.length;i++){
    const q=tr[i], age=G.t-q.t; if(age<WAKE_DELAY) continue;
    const fade=clamp((age-WAKE_DELAY)/1.2,0,1)*Math.pow(clamp(1-age/24,0,1),1.4);
    const p0=i>0?tr[i-1]:q, pr0=proj(env,q.x,q.y,0); if(!pr0||pr0.d<20) continue;
    // fill the gap to the previous point so close-up foam reads as one continuous streak
    const n=clamp(Math.ceil(dist(q.x,q.y,p0.x,p0.y)*pr0.sc/Math.max(2,(1.1+age*.45)*pr0.sc)),1,8);
    for(let k=0;k<n;k++){
      const u=k/n, x=lerp(q.x,p0.x,u), y=lerp(q.y,p0.y,u), pr=k?proj(env,x,y,0):pr0; if(!pr||pr.d<20) continue;
      const wm=(1.1+age*.45)*q.s*(1+.15*Math.sin(i*2.3+k)), w=Math.max(1.5,wm*pr.sc*2.2), h=Math.max(.7,w*env.eye/pr.d*1.6);
      c.globalAlpha=a0*fade*.75; c.drawImage(SPR.puff,pr.x-w/2+q.j*pr.sc,pr.y-h/2,w,h);
    }
  }
  c.globalAlpha=1;
}
function drawRaft(c,env,pr){
  const sc=pr.sc, dye=9*sc*2, dh=Math.max(1,dye*env.eye/pr.d*1.8);

function hearRange(e){ return e.T.sub ? (e.dep<1?7000:2600) : 9000; }
function shipNoise(e){ return (e.v/10+.3)*(e.T.sub?(e.dep<1?1:.35):1)*(e.listenT>0?.15:1); }
// what the hydrophones pick up on a bearing: summed intensity and the loudest source
function hydroAt(b){
  const s=G.sub; let I=0, best=null, bi=0;
  for(const e of G.ships){ if(e.sunk||e.sinking||e.escaped) continue;
    const d=dist(s.x,s.y,e.x,e.y), hr=hearRange(e); if(d>hr) continue;
    const amp=shipNoise(e)*Math.pow(1-d/hr,1.3), w=3+d/1600, db=wrap180(brgTo(s.x,s.y,e.x,e.y)+e.jit*.5-b);
    const v=amp*Math.exp(-db*db/(2*w*w)); I+=v; if(v>bi){ bi=v; best=e; } }
  for(const t of G.torps){ if(!t.alive||!t.enemy) continue; const d=dist(s.x,s.y,t.x,t.y); if(d>3000) continue;
    const db=wrap180(brgTo(s.x,s.y,t.x,t.y)-b), v=1.2*(1-d/3000)*Math.exp(-db*db/18); I+=v; if(v>bi){ bi=v; best={torp:true}; } }

}

  c.beginPath(); c.moveTo(C,0); c.lineTo(C,S); c.moveTo(0,C); c.lineTo(S,C); c.stroke();
  c.font=`${Math.max(9,S*.045)}px ${MONO}`; c.fillStyle='rgba(201,164,92,.6)'; c.textAlign='center'; c.fillText('N',C,12);
  c.textAlign='left'; c.fillText('1 km',C+1000*k+2,C-3);
  if(scopeExposed()){
    c.setLineDash([3,4]); c.strokeStyle='rgba(227,166,60,.35)';
    c.beginPath(); c.arc(C,C,(G.night?900:2000)*G.wx.enemy*k,0,TAU); c.stroke(); c.setLineDash([]);
  }
  const pb=G.scopeBrg*D2R;
  c.fillStyle='rgba(233,226,207,.08)';
  c.beginPath(); c.moveTo(C,C); c.arc(C,C,S,(G.scopeBrg-G.fov/2-90)*D2R,(G.scopeBrg+G.fov/2-90)*D2R); c.closePath(); c.fill();
  c.strokeStyle='rgba(233,226,207,.5)'; c.setLineDash([5,4]);
  c.beginPath(); c.moveTo(C,C); c.lineTo(C+Math.sin(pb)*S,C-Math.cos(pb)*S); c.stroke(); c.setLineDash([]);
  // mines picked up by the mine-detecting sonar
  for(const m of G.mines){ if(!m.known) continue; const [x,y]=P(m.x,m.y);
    c.strokeStyle=m.gone?'rgba(226,85,63,.4)':'rgba(226,85,63,.85)'; c.beginPath(); c.arc(x,y,2.2,0,TAU); c.stroke(); }
  if(G.raft && !G.raft.lost){ const [x,y]=P(G.raft.x,G.raft.y);
    c.fillStyle=G.raft.done?'rgba(150,220,120,.4)':'#96dc78'; c.beginPath(); c.arc(x,y,4,0,TAU); c.fill();
    if(G.raft.prog>0&&!G.raft.done){ c.strokeStyle='#96dc78'; c.lineWidth=2; c.beginPath(); c.arc(x,y,8,-Math.PI/2,-Math.PI/2+TAU*G.raft.prog); c.stroke(); c.lineWidth=1; } }
  for(const fl of G.flares){ const [x,y]=P(fl.x,fl.y); c.fillStyle=`rgba(255,230,150,${1-fl.life/fl.max})`; c.beginPath(); c.arc(x,y,3,0,TAU); c.fill(); }
  for(const e of G.ships){
    if(e.sunk||e.escaped||e.sinking) continue;
    if(G.t-e.seenT<2) continue;
    const d=dist(s.x,s.y,e.x,e.y); if(d>hearRange(e)) continue;
    e.jit += (Math.random()-.5)*.3; e.jit=clamp(e.jit,-3,3);
    const b=(brgTo(s.x,s.y,e.x,e.y)+e.jit)*D2R;
    c.strokeStyle=`rgba(227,166,60,${clamp(.5-d/18000,.12,.45)})`;
    c.beginPath(); c.moveTo(C+Math.sin(b)*10,C-Math.cos(b)*10); c.lineTo(C+Math.sin(b)*S,C-Math.cos(b)*S); c.stroke();
  }
  for(const e of G.ships){
    if(e.escaped || e.seenT<-100) continue;
    const age=G.t-e.seenT; if(age>90 && !e.sunk) continue;
    const [x,y]=P(e.seenX,e.seenY);
    if(e.sunk||e.sinking){ c.strokeStyle='rgba(233,226,207,.45)'; c.beginPath(); c.moveTo(x-4,y-4); c.lineTo(x+4,y+4); c.moveTo(x+4,y-4); c.lineTo(x-4,y+4); c.stroke(); continue; }
    const a=clamp(1-age/90,.25,1);
    const col = e.role==='neutral'&&e.idd?[150,210,140]:e.alert<SUS?[205,198,176]:e.alert<HUNT?[227,166,60]:[226,85,63];
    c.save(); c.translate(x,y); c.rotate(e.seenH*D2R);
    const len=Math.max(e.role==='escort'?6:9, e.T.L*k), wid=Math.max(3,len*.3);
    c.fillStyle=rgb(col,a); c.beginPath(); c.moveTo(0,-len/2); c.lineTo(wid/2,len/3); c.lineTo(-wid/2,len/3); c.closePath(); c.fill();
    if(age<2){ c.strokeStyle=rgb(col,.6); c.beginPath(); c.moveTo(0,-len/2); c.lineTo(0,-len/2-e.v*6*k*10); c.stroke(); }
    c.restore();
  }
  for(const t of G.torps){
    if(t.enemy && dist(s.x,s.y,t.x,t.y)>3000) continue;
    c.strokeStyle=t.enemy?'rgba(255,90,70,.6)':'rgba(240,245,245,.35)'; c.beginPath();
    t.trail.forEach((q,i)=>{ const [x,y]=P(q.x,q.y); i?c.lineTo(x,y):c.moveTo(x,y); }); if(t.alive){ const [x,y]=P(t.x,t.y); c.lineTo(x,y);} c.stroke();
    if(t.alive){ const [x,y]=P(t.x,t.y); c.fillStyle=t.enemy?'#ff5a46':'#fff'; c.fillRect(x-1.5,y-1.5,3,3); }
  }
  for(const b of G.booms){ const age=G.rt-b.t; if(age>3) continue; const [x,y]=P(b.x,b.y);
    c.strokeStyle=`rgba(226,85,63,${1-age/3})`; c.beginPath(); c.arc(x,y,3+age*8,0,TAU); c.stroke(); }
  G.booms=G.booms.filter(b=>G.rt-b.t<3);
  if(scopeExposed()) for(const pl of G.planes){ if(dist(s.x,s.y,pl.x,pl.y)>8000) continue; const [x,y]=P(pl.x,pl.y);
    c.save(); c.translate(x,y); c.rotate(pl.h*D2R); c.strokeStyle=pl.attack?'#ff5a46':'#e9e2cf'; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(-5,0); c.lineTo(5,0); c.moveTo(0,-4); c.lineTo(0,5); c.moveTo(-2,4); c.lineTo(2,4); c.stroke(); c.restore(); }
  c.save(); c.translate(C,C); c.rotate(s.h*D2R);
  c.fillStyle='#9fd3b6'; c.beginPath(); c.moveTo(0,-8); c.lineTo(4,6); c.lineTo(0,4); c.lineTo(-4,6); c.closePath(); c.fill();
  c.restore();
}
